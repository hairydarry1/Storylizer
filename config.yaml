# Story Pipeline configuration.
# Adapters, models and randomness live here; changing them is a config change, not a code change.

seed: 20261106   # every random roll derives from this seed (BUILD_SPEC.md section 6)
chaos_dial: 1    # 0 = tame .. 3 = chaotic: how many random constraints each stage applies

adapters:
  # Text generation: echo | manual | openai_compatible
  llm:
    type: echo
    options:
      response: echo

