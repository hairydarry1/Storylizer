# Story Pipeline configuration.
# Adapters, models and randomness live here; changing them is a config change, not a code change.

seed: 20261106   # every random roll derives from this seed (BUILD_SPEC.md section 6)
chaos_dial: 1    # 0 = tame .. 3 = chaotic: how many random constraints each stage applies

# Deterministic linter thresholds (`story check`), BUILD_SPEC.md section 7.
gates:
  linter:
    repeated_phrase_lengths: [3, 4, 5]   # word n-grams counted as repeated phrases
    repeated_phrase_min_count: 3         # occurrences before a phrase is flagged
    overused_word_min_count: 6           # minimum uses before a word is flagged
    overused_word_per_1000: 8            # and its rate per 1,000 words
    tic_words: [just, really, very, suddenly, somehow, actually, quite, almost, only, even, still, then]
    tic_min_count: 3                     # minimum uses before a tic is flagged
    tic_per_1000: 5                      # and its rate per 1,000 words
    uniform_sentence_stdev: 2.5          # flag when sentence lengths are this even
    uniform_min_sentences: 8             # only once the chapter has this many sentences
    paragraph_opener_words: 1            # words compared at the start of each paragraph
    paragraph_opener_min_count: 3        # paragraphs sharing an opener before it is flagged
    banned_phrase_min_count: 1           # any use of a banned phrase fails

adapters:
  llm:
    type: openai_compatible
    options:
      timeout: 120
      providers:
        planner:
          base_url: https://generativelanguage.googleapis.com/v1beta/openai
          model: gemini-3.8-flash
          api_key_env: GEMINI_API_KEY
        writer:
          base_url: https://generativelanguage.googleapis.com/v1beta/openai
          model: gemini-3.8-flash
          api_key_env: GEMINI_API_KEY
        checker:
          base_url: https://generativelanguage.googleapis.com/v1beta/openai
          model: gemini-3.8-flash
          api_key_env: GEMINI_API_KEY

  search:
    type: stub
    options:
      timeout: 120
      retries: 5
      backoff: 2
      max_backoff: 60
      results: []
      

  # Image generation is milestone M8.

